<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background Dark Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="50%" stop-color="#0a0a0c"/>
      <stop offset="100%" stop-color="#141416"/>
    </linearGradient>
    
    <!-- Outer Glow -->
    <filter id="whiteGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <linearGradient id="whiteGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>

    <radialGradient id="innerShine" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Deep Black Squircle Background -->
  <rect x="32" y="32" width="960" height="960" rx="240" fill="url(#bgGrad)" stroke="#27272a" stroke-width="8"/>
  <rect x="32" y="32" width="960" height="960" rx="240" fill="url(#innerShine)"/>

  <!-- Subtle Precision Grid Crosses -->
  <circle cx="256" cy="256" r="3" fill="#3f3f46" opacity="0.4"/>
  <circle cx="768" cy="256" r="3" fill="#3f3f46" opacity="0.4"/>
  <circle cx="256" cy="768" r="3" fill="#3f3f46" opacity="0.4"/>
  <circle cx="768" cy="768" r="3" fill="#3f3f46" opacity="0.4"/>

  <!-- High-Precision Center White Monogram & Candlesticks -->
  <g filter="url(#whiteGlow)">
    <!-- Bullish Candlestick 1 (Left Support) -->
    <line x1="288" y1="560" x2="288" y2="760" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round"/>
    <rect x="264" y="610" width="48" height="100" rx="12" fill="#FFFFFF"/>

    <!-- Bullish Candlestick 2 (Center Breakout / Stem of T) -->
    <line x1="512" y1="340" x2="512" y2="760" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round"/>
    <rect x="484" y="420" width="56" height="230" rx="14" fill="#FFFFFF"/>

    <!-- Top Horizontal Crossbar of "T" with Precision Angles -->
    <path d="M 270 330 L 754 330 C 768 330 776 342 770 354 L 728 410 C 722 418 712 422 702 422 L 322 422 C 312 422 302 418 296 410 L 254 354 C 248 342 256 330 270 330 Z" fill="url(#whiteGrad)"/>

    <!-- Bullish Candlestick 3 (Right Apex) -->
    <line x1="736" y1="210" x2="736" y2="520" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round"/>
    <rect x="712" y="270" width="48" height="150" rx="12" fill="#FFFFFF"/>

    <!-- Exponential Trajectory Trend Line -->
    <path d="M 220 720 Q 460 690 640 450 T 800 240" fill="none" stroke="#FFFFFF" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Arrowhead at Apex -->
    <polygon points="800,240 730,240 760,285" fill="#FFFFFF"/>
    <circle cx="800" cy="240" r="16" fill="#FFFFFF"/>
  </g>
</svg>
