<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Premium Dark Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="50%" stop-color="#08080a"/>
      <stop offset="100%" stop-color="#121216"/>
    </linearGradient>

    <!-- Subtle Radial Shine -->
    <radialGradient id="centerShine" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Soft Luminous Glow for Pure White Line -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Black Squircle Frame (4K Luxury Container) -->
  <rect x="32" y="32" width="960" height="960" rx="240" fill="url(#bgGrad)" stroke="#27272a" stroke-width="8"/>
  <rect x="32" y="32" width="960" height="960" rx="240" fill="url(#centerShine)"/>

  <!-- Ambient Glow Layer -->
  <g filter="url(#softGlow)" opacity="0.35">
    <polyline
      points="200,668 356,460 512,564 668,252 824,356"
      stroke="#FFFFFF"
      stroke-width="64"
      stroke-linecap="round"
      stroke-linejoin="round"
      fill="none"
    />
    <line
      x1="200" y1="772"
      x2="824" y2="772"
      stroke="#FFFFFF"
      stroke-width="52"
      stroke-linecap="round"
    />
  </g>

  <!-- Crisp Pure White Middle Graphic (Old Iconic Trading Chart, 4K High Precision) -->
  <g>
    <!-- Chart Polyline: (4,24) -> (10,16) -> (16,20) -> (22,8) -> (28,12) -->
    <polyline
      points="200,668 356,460 512,564 668,252 824,356"
      stroke="#FFFFFF"
      stroke-width="64"
      stroke-linecap="round"
      stroke-linejoin="round"
      fill="none"
    />

    <!-- Bottom Baseline: (4,28) to (28,28) -->
    <line
      x1="200" y1="772"
      x2="824" y2="772"
      stroke="#FFFFFF"
      stroke-width="52"
      stroke-linecap="round"
    />

    <!-- Peak Apex Precision Accent (Point 22,8) -->
    <circle cx="668" cy="252" r="18" fill="#FFFFFF"/>
  </g>
</svg>
